<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coderz Open Day</title>
  </head>
  <body>
    <h1>coderz Open Day</h1>
    <table border="1">
      <caption>
        Visitors by room and time
      </caption>
      <thead>
        <tr>
          <th scope="col">Room</th>
          <th scope="col">Time</th>
          <th scope="col">Visitors</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="rowgroup" rowspan="2">Lab A</th>
          <td>Morning</td>
          <td>12</td>
        </tr>
        <tr>
          <td>Evening</td>
          <td>8</td>
        </tr>

        <tr>
          <th scope="row">Lab B</th>
          <td>Morning</td>
          <td>5</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th scope="colgroup" colspan="2">Total visitors</th>
          <td>25</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
