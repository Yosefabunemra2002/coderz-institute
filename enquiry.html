<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإسنفسار</title>
</head>
<body>
  
  <br>
  <form>
    <label for="name">الأسم الكامل</label>
    <input type="text" id="name" placeholder="احمد علي" autocomplete="name" name="fullname">
    <br>
    <br>
    <label for="mail">البريد الإلكتروني</label>
    <input type="email" id="mail" name="email" autocomplete="email">
    <br>
    <br>
    <label for="phone">رقم الهاتف</label>
    <input type="tel" id="phone" name="phone" autocomplete="tel">

  </form>
  <br>
  <label for="course">الكورسات</label>
  <select id="course" name="course">
    <option value="">اختر دورة</option>
    <option value="content">HTML Content</option>
    <option value="forms">HTML Forms</option>
  </select>
  <br>
  <br>
  <label for="num">عدد المقاعد</label>
  <input id="num" type="number" value="1" name="number">
  <br>
  <br>
  <label for="clender">التاريخ المحدد</label>
  <input id="clender" type="date" name="date">
  <br>
  <br>
  <label for="message">نص الإسنفسار</label>
  <textarea id="message" name="message" rows="3"></textarea>
  <br>
  <br>
  <button>submit</button>
